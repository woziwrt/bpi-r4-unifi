name: Build BPI-R4 UniFi

on:
  workflow_dispatch:
    inputs:
      repo_commit:
        description: 'Commit hash of this repository (leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.repo_commit || github.sha }}

      - name: Set build variables
        run: |
          echo "RELEASE_TAG=release-nvme" >> $GITHUB_ENV
          echo "RELEASE_NAME=BPI-R4 UniFi build (latest)" >> $GITHUB_ENV

      - name: Delete existing release and tag
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;

            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100
            });

            for (const rel of releases.data) {
              if (rel.tag_name === tag) {
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: rel.id
                }).catch(e => console.log(`Failed to delete release ${rel.id}: ${e.message}`));
              }
            }

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `tags/${tag}`
            }).catch(e => console.log(`Failed to delete tag ${tag}: ${e.message}`));
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space on runner
        run: |
          sudo rm -rf \
            "$AGENT_TOOLSDIRECTORY" \
            /opt/ghc \
            /opt/google/chrome \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /opt/pipx \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache git

      - name: Run builder script
        run: |
          chmod +x build-unifi.sh
          ./build-unifi.sh

      - name: Prepare artifacts
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          cp openwrt-mediatek-filogic-bananapi_bpi-r4-squashfs-sysupgrade.itb bpi-r4.itb

      - name: Generate sha256sums
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          sha256sum \
            openwrt-mediatek-filogic-bananapi_bpi-r4-nvme-img.bin \
            bpi-r4.itb \
            > sha256sums
          cp sha256sums ../../../../../my_files/bpi-r4-install/ 2>/dev/null || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ## BPI-R4 UniFi Stack
            UniFi Network + UniFi Protect + G5 Flex on OpenWrt / Docker / NVMe

            Repository commit: ${{ github.event.inputs.repo_commit || github.sha }}

            See README for installation instructions.
          files: |
            my_files/bpi-r4-install/sd-rescue.img.gz
            openwrt/bin/targets/mediatek/filogic/openwrt-mediatek-filogic-bananapi_bpi-r4-nvme-img.bin
            openwrt/bin/targets/mediatek/filogic/bpi-r4.itb
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/config.buildinfo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}